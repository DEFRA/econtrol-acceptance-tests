name: Run Journey Tests

on:
  workflow_dispatch:
    inputs:
      test-tags:
        description: Cucumber tag expression to run
        required: false
        default: '@smoke'
        type: string
      test-env:
        description: Test environment
        required: false
        default: dev
        type: choice
        options:
          - dev
          - qa
  workflow_call:
    inputs:
      test-tags:
        description: Cucumber tag expression to run
        required: false
        default: '@smoke'
        type: string
      test-env:
        description: Test environment
        required: false
        default: dev
        type: string

permissions:
  contents: read

env:
  HEADLESS: 'true'
  TEST_ENV: ${{ inputs.test-env || secrets.TEST_ENV || 'dev' }}
  URL: ${{ (inputs.test-env || secrets.TEST_ENV || 'dev') == 'dev' && secrets.DEV_URL || secrets.QA_URL }}
  BASE_URL: ${{ (inputs.test-env || secrets.TEST_ENV || 'dev') == 'dev' && secrets.DEV_URL || secrets.QA_URL }}
  EMAIL: ${{ secrets.EMAIL }}
  PASSWORD: ${{ secrets.PASSWORD }}
  DEV_DATAVERSE_BASE_URL: ${{ secrets.DEV_DATAVERSE_BASE_URL }}
  DEV_DATAVERSE_CLIENT_ID: ${{ secrets.DEV_DATAVERSE_CLIENT_ID }}
  TEST_DATAVERSE_BASE_URL: ${{ secrets.QA_DATAVERSE_BASE_URL || secrets.TEST_DATAVERSE_BASE_URL }}
  TEST_DATAVERSE_CLIENT_ID: ${{ secrets.QA_DATAVERSE_CLIENT_ID || secrets.TEST_DATAVERSE_CLIENT_ID }}
  API_BASE_URL: ${{ (inputs.test-env || secrets.TEST_ENV || 'dev') == 'dev' && secrets.DEV_DATAVERSE_BASE_URL || secrets.QA_DATAVERSE_BASE_URL || secrets.TEST_DATAVERSE_BASE_URL }}
  API_TOKEN_VERSION: ${{ secrets.API_TOKEN_VERSION || '1' }}
  API_TOKEN_GRANT_TYPE: ${{ secrets.API_TOKEN_GRANT_TYPE || 'client_credentials' }}
  API_TOKEN_RESOURCE: ${{ secrets.API_TOKEN_RESOURCE }}
  API_CLIENT_ID: ${{ secrets.API_CLIENT_ID }}
  API_CLIENT_SECRET: ${{ secrets.API_CLIENT_SECRET }}
  API_BEARER_TOKEN: ${{ secrets.API_BEARER_TOKEN }}
  API_SEARCH_PERMIT_NUMBER: ${{ vars.API_SEARCH_PERMIT_NUMBER }}
  ENDORSEMENT_PERMIT_ID: ${{ vars.ENDORSEMENT_PERMIT_ID }}
  ENDORSEMENT_PERMIT_NUMBER: ${{ vars.ENDORSEMENT_PERMIT_NUMBER }}

jobs:
  journey-tests:
    name: Run ${{ inputs.test-tags || '@smoke' }} tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run journey tests
        uses: ./run-journey-tests
        with:
          test-tags: ${{ inputs.test-tags || '@smoke' }}
