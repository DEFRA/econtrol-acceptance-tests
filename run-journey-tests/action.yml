name: Run Journey Tests
description: Install dependencies, run WebdriverIO journey tests, and upload Allure reports.

inputs:
  test-tags:
    description: Cucumber tag expression to run.
    required: false
    default: '@test'

runs:
  using: composite

  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Clean previous reports
      shell: bash
      run: npm run clean

    - name: Run tests
      shell: bash
      run: npx wdio run wdio.conf.js --cucumberOpts.tagExpression="${{ inputs.test-tags }}"

    - name: Generate Allure report
      if: always()
      shell: bash
      run: npm run report

    - name: Upload Allure report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: ./allure-report
        if-no-files-found: warn

    - name: Upload Allure results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-results
        path: ./allure-results
        if-no-files-found: warn
