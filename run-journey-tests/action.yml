name: Run Journey Tests
description: Install dependencies, run WebdriverIO journey tests, and upload Allure reports.

inputs:
  test-tags:
    description: Cucumber tag expression to run.
    required: false
    type: string
  example-node-frontend:
    required: false
    type: string

runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@v4
      with:
        repository: DEFRA/econtrol-acceptance-tests

    - name: Docker Login
      uses: DEFRA/cdp-build-action/docker-login@main

    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: npm
    - name: Setup the tests
      run: npm i
      shell: bash
    - name: Start docker compose
      shell: bash
      run: |
        CDP_EXAMPLE_NODE_FRONTEND=${{inputs.example-node-frontend}} \
        CDP_EXAMPLE_NODE_BACKEND=${{inputs.example-node-backend}} \
        docker compose up --wait-timeout 300 -d --quiet-pull
    - name: Run the tests
      shell: bash
      run: |
        npm run test:smoke
        npm run report
    - name: debug
      if: always()
      shell: bash
    - name: Upload allure report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: ./allure-report
    - name: Upload docker compose logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: docker-compose-logs
        path: ./logs.txt
