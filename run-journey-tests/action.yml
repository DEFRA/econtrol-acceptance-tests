name: Run Journey Tests
description: Install dependencies, run WebdriverIO journey tests, and upload Allure reports.

inputs:
  test-tags:
    description: Cucumber tag expression to run.
    required: false
    default: '@smoke'

runs:
  using: composite

  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Clean previous reports
      shell: bash
      run: npm run clean

    - name: Validate application environment
      if: ${{ !contains(inputs.test-tags, '@api') }}
      shell: bash
      run: |
        if [ -z "$URL" ] && [ -z "$BASE_URL" ]; then
          echo "URL/BASE_URL is not set. Add DEV_URL as a GitHub secret for dev runs, or QA_URL for QA runs."
          exit 1
        fi

        if [ -z "$EMAIL" ]; then
          echo "EMAIL is not set. Add it as a GitHub secret."
          exit 1
        fi

        if [ -z "$PASSWORD" ]; then
          echo "PASSWORD is not set. Add it as a GitHub secret."
          exit 1
        fi

        node -e "
          const dns = require('node:dns')
          const target = process.env.URL || process.env.BASE_URL
          const host = new URL(target).hostname

          dns.lookup(host, (error) => {
            if (error) {
              console.error(\`Could not resolve application host: \${host}. Check the URL secret, or run these tests on a runner that can access the environment network.\`)
              process.exit(1)
            }
          })
        "

    - name: Validate API environment
      if: contains(inputs.test-tags, '@api')
      shell: bash
      run: |
        if [ -z "$API_BASE_URL" ]; then
          echo "API_BASE_URL is not set. Add QA_DATAVERSE_BASE_URL or TEST_DATAVERSE_BASE_URL for QA runs, and DEV_DATAVERSE_BASE_URL for dev runs."
          exit 1
        fi

        if [ -z "$API_BEARER_TOKEN" ] && [ -z "$API_TOKEN" ]; then
          if [ "$API_TOKEN_GRANT_TYPE" = "implicit" ]; then
            echo "API_TOKEN_GRANT_TYPE=implicit requires API_BEARER_TOKEN. Use client_credentials with API_CLIENT_ID and API_CLIENT_SECRET to generate tokens automatically."
            exit 1
          fi

          if [ "$API_TOKEN_GRANT_TYPE" != "client_credentials" ]; then
            echo "Set API_TOKEN_GRANT_TYPE=client_credentials to generate API tokens automatically, or set API_BEARER_TOKEN for a manual token."
            exit 1
          fi

          EFFECTIVE_API_CLIENT_ID="$API_CLIENT_ID"

          if [ -z "$EFFECTIVE_API_CLIENT_ID" ]; then
            if [ "$TEST_ENV" = "dev" ]; then
              EFFECTIVE_API_CLIENT_ID="$DEV_DATAVERSE_CLIENT_ID"
            else
              EFFECTIVE_API_CLIENT_ID="$TEST_DATAVERSE_CLIENT_ID"
            fi
          fi

          if [ -z "$EFFECTIVE_API_CLIENT_ID" ] || [ -z "$API_CLIENT_SECRET" ]; then
            echo "Set API_BEARER_TOKEN, or set API_TOKEN_GRANT_TYPE=client_credentials with API_CLIENT_SECRET and API_CLIENT_ID/DEV_DATAVERSE_CLIENT_ID/TEST_DATAVERSE_CLIENT_ID for automatic token generation."
            exit 1
          fi
        fi

        if [ -z "$API_SEARCH_PERMIT_NUMBER" ]; then
          echo "API_SEARCH_PERMIT_NUMBER is not set. Add it as a GitHub Actions variable."
          exit 1
        fi

        if [ -z "$ENDORSEMENT_PERMIT_ID" ]; then
          echo "ENDORSEMENT_PERMIT_ID is not set. Add it as a GitHub Actions variable."
          exit 1
        fi

        if [ -z "$ENDORSEMENT_PERMIT_NUMBER" ]; then
          echo "ENDORSEMENT_PERMIT_NUMBER is not set. Add it as a GitHub Actions variable."
          exit 1
        fi

    - name: Run tests
      shell: bash
      run: npx wdio run wdio.conf.js --cucumberOpts.tags="${{ inputs.test-tags }}"

    - name: Generate Allure report
      if: always()
      shell: bash
      run: |
        mkdir -p allure-results
        npm run report

    - name: Upload Allure report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: ./allure-report
        if-no-files-found: warn

    - name: Upload Allure results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-results
        path: ./allure-results
        if-no-files-found: warn
