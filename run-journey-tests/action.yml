name: Run Journey Tests on GitHub
description: Run smoke/journey tests and generate Allure reports

runs:
  using: "composite"
  steps:
    - name: Checkout acceptance tests
      uses: actions/checkout@v4
      with:
        repository: DEFRA/econtrol-acceptance-tests

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm

    - name: Setup the tests
      run: npm i
      shell: bash

    - name: Run the tests
      shell: bash
      run: |
        npm run test:github

    - name: Generate Allure report
      if: always()
      shell: bash
      run: npm run report

    - name: Upload allure report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: ./allure-report